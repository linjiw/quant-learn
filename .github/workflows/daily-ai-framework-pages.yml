name: Daily AI Framework Pages

on:
  schedule:
    # GitHub cron is UTC. 14:00 UTC is morning Pacific time:
    # 06:00 PST during standard time and 07:00 PDT during daylight time.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-framework-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Refresh data and build Pages artifact
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: uv run python -m scripts.daily_ai_framework_refresh --include-sec

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
